[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Same toolchain as the Touchstone dependency (lib/touchstone, pinned b893fc6).
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read", path = "./audits" }, { access = "read-write", path = "./output" }]

[profile.default.fuzz]
seed = "0x7ea6"

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.invariant.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.mutation]
fuzz = { runs = 64 }
invariant = { runs = 16, depth = 32 }
